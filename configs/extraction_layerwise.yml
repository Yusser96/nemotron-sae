# Residual stream after every one of the first 14 layers (Mamba / MoE /
# attention blocks alternate as MEMEM*EMEMEM*E...) plus three deep layers, to
# localise where two extraction backends start to disagree.
# Used with cli.dump_activations and cli.compare_activations.
run_id: extraction_layerwise

model:
  name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  dtype: bfloat16
  load_quant: auto
  trust_remote_code: true
  device_map: auto

data:
  sources:
    - {source: epfml/FineWeb2-HQ, name: deu_Latn, language: de}
    - {source: nvidia/Nemotron-CC-v2.1, name: High-Quality, language: en}
  split: train
  streaming: true
  total_tokens: 65_536  # 32 sequences x 2048
  seq_len: 2048
  shuffle_buffer: 0
  seed: 42
  validation_fraction: 0.05

extraction:
  vllm:
    # The bf16 weights take ~59 GiB; 0.93 still leaves KV-cache room on an 80 GB GPU.
    gpu_memory_utilization: 0.93
    sequences_per_call: 8
  sink:
    path: /dev/shm/sae-activations-${SLURM_JOB_ID}
    lifecycle: consume

target:
  sites:
    - {slug: L0_resid_post, layer: 0, component: resid_post, hook_name: backbone.layers.0}
    - {slug: L1_resid_post, layer: 1, component: resid_post, hook_name: backbone.layers.1}
    - {slug: L2_resid_post, layer: 2, component: resid_post, hook_name: backbone.layers.2}
    - {slug: L3_resid_post, layer: 3, component: resid_post, hook_name: backbone.layers.3}
    - {slug: L4_resid_post, layer: 4, component: resid_post, hook_name: backbone.layers.4}
    - {slug: L5_resid_post, layer: 5, component: resid_post, hook_name: backbone.layers.5}
    - {slug: L6_resid_post, layer: 6, component: resid_post, hook_name: backbone.layers.6}
    - {slug: L7_resid_post, layer: 7, component: resid_post, hook_name: backbone.layers.7}
    - {slug: L8_resid_post, layer: 8, component: resid_post, hook_name: backbone.layers.8}
    - {slug: L9_resid_post, layer: 9, component: resid_post, hook_name: backbone.layers.9}
    - {slug: L10_resid_post, layer: 10, component: resid_post, hook_name: backbone.layers.10}
    - {slug: L11_resid_post, layer: 11, component: resid_post, hook_name: backbone.layers.11}
    - {slug: L12_resid_post, layer: 12, component: resid_post, hook_name: backbone.layers.12}
    - {slug: L13_resid_post, layer: 13, component: resid_post, hook_name: backbone.layers.13}
    - {slug: L26_resid_post, layer: 26, component: resid_post, hook_name: backbone.layers.26}
    - {slug: L42_resid_post, layer: 42, component: resid_post, hook_name: backbone.layers.42}
    - {slug: L51_resid_post, layer: 51, component: resid_post, hook_name: backbone.layers.51}
